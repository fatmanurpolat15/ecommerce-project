services:
  ecommerce-postgres:
    image: postgres:17
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 150503
    ports:
      - "5433:5432"
    volumes:
      - ecommerce-postgres-data:/var/lib/postgresql/data

volumes:
  ecommerce-postgres-data: